name: 部署 GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 检出
        uses: actions/checkout@v5

      - name: 开启并配置 Pages
        uses: actions/configure-pages@v6
        with:
          # GITHUB_TOKEN 往往没有仓库管理权限，开启可能失败。失败时见下方说明。
          enablement: true

      - name: 组装站点
        run: bash scripts/assemble_site.sh

      - name: 上传产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: 部署
        id: deployment
        uses: actions/deploy-pages@v5

      - name: 若部署失败
        if: failure()
        run: |
          echo "::error::Pages 未能发布。请仓库所有者打开 Settings → Pages → Build and deployment，Source 选 GitHub Actions 并保存，然后重新运行「部署 GitHub Pages」。若日志是权限错误，再到 Settings → Actions → General → Workflow permissions，选 Read and write permissions。"
