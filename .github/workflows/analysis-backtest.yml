name: 每日回测

on:
  schedule:
    # 每天 01:15 UTC。Actions cron 就是调度器，仓库里不跑 APScheduler。
    - cron: '15 1 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'analysis/**'
      - '.github/workflows/analysis-backtest.yml'
      - 'requirements-analysis.txt'
      - 'js/indicators.js'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: analysis-data
  cancel-in-progress: false

jobs:
  backtest:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: 检出
        uses: actions/checkout@v5
        with:
          ref: main
          persist-credentials: true

      - name: 安装 Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-analysis.txt

      - name: 安装分析依赖
        run: bash scripts/install_analysis.sh

      - name: 复用已下载的 K 线
        uses: actions/cache@v4
        with:
          path: data/cache
          key: ohlcv-${{ github.run_id }}
          restore-keys: ohlcv-

      - name: 对照浏览器打分
        run: python3 analysis/parity_check.py

      - name: 回测并生成报告
        run: python3 -m analysis.run_backtest

      - name: 仅在内容变化时提交
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/backtest/summary.json data/history.duckdb data/history reports
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "回测结果无变化，跳过提交"
          else
            git commit -m "data: 更新回测结果与 QuantStats 报告"
            ok=false
            for i in 1 2 3 4; do
              if git pull --rebase origin main && git push origin HEAD:main; then
                ok=true
                break
              fi
              sleep $((i * 5))
            done
            if [ "$ok" != true ]; then
              echo "推送失败"
              exit 1
            fi
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 组装站点
        if: steps.commit.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        run: bash scripts/assemble_site.sh

      - name: 开启并配置 Pages
        id: pagescfg
        if: steps.commit.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        uses: actions/configure-pages@v6
        with:
          enablement: true

      - name: 上传产物
        if: steps.pagescfg.outcome == 'success'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: 部署
        if: steps.pagescfg.outcome == 'success'
        id: deployment
        uses: actions/deploy-pages@v5
